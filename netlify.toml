[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Turbopack keeps a copy of build-time env in its cache. The cache is never served,
  # but Netlify's secrets scanner reads it, so exclude it from the scan.
  SECRETS_SCAN_OMIT_PATHS = ".next/cache/**,.netlify/**"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Keeps the free Supabase project from pausing after a week of inactivity.
[functions]
  directory = "netlify/functions"

[functions."keepalive"]
  schedule = "0 6 * * *"
